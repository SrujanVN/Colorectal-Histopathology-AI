services:
  colorectal-app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 8000
    ports:
      - "${APP_PORT:-8000}:8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
